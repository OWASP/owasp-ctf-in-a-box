version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/sync"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/scorer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # React refuses to run unless react and react-dom are the exact same
    # version, so they must bump in one PR (with their @types) — never apart.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Same rule, different reason. `next` and `eslint-config-next` are both
      # pinned EXACTLY (no caret) in apps/web/package.json, deliberately kept
      # on the same version — eslint-config-next ships the lint rules for the
      # Next it was released with. Ungrouped, dependabot opens one PR each;
      # they then edit the same two files, so the second conflicts and needs a
      # rebase, and merging one alone leaves main on a mismatched pair.
      #
      # This is not hypothetical: #161 and #164 arrived as exactly that split.
      next:
        patterns:
          - "next"
          - "eslint-config-next"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # codeql.yml runs `init` and `analyze` from github/codeql-action, and the
      # analyze step refuses to run against a database `init` built with another
      # version. Ungrouped, Dependabot opens one PR per step and each fails
      # CodeQL on its own.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base images are digest-pinned (issue #49), which is what makes a build
  # reproducible and a swapped image detectable. It also means a pin is frozen
  # until something moves it: a floating `node:22-alpine` silently picks up the
  # next 22.x patch, a pinned one never does. These entries are the half of the
  # trade that keeps a pin from quietly becoming a stale base — without them,
  # digest-pinning trades a supply-chain risk for an unpatched-CVE one.
  - package-ecosystem: "docker"
    directories:
      - "/sync"
      - "/scorer"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All three Dockerfiles run the SAME node base. Ungrouped, a bump opens
      # three PRs that must all land or the images drift apart — one service
      # on a different 22.x than the other two is a difference nobody chose.
      node-base:
        patterns:
          - "node"
    # Patches only, and that is the whole point of the entry above: refresh the
    # digest so a pin (#49) does not become a stale, unpatched base. The Node
    # LINE is a different decision. CI runs Node 22 everywhere (AGENTS.md), and
    # the images are what make the shipped containers agree with the version the
    # suites gate on — a sync/scorer suite was green on 25 and red on 22 in CI
    # (#256, an unref'd AbortSignal.timeout timer), so shipping a runtime the
    # suites never ran on is exactly the trade this repo refuses.
    #
    # Minor is ignored alongside major because it moves the runtime just as
    # much: node:26-alpine arrived as a "group bump" in #398 and failed four
    # jobs on `corepack enable` — corepack is unbundled from Node 25 onward.
    # Changing the line is a deliberate migration (CI matrix, the `engines`
    # floor, the pnpm bootstrap and all three images, suites re-run on the new
    # runtime), never a dependency PR.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # The AWS module pins its provider (and any future modules); without this
  # entry those pins never see an update PR — the only ecosystem in the repo
  # that was left out.
  - package-ecosystem: "terraform"
    directory: "/deploy/aws-terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
