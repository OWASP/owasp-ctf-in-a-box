<svg viewBox="0 0 880 512" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">Data flow for a score</title>
  <desc id="desc">A contestant opens a PR; a pull_request_target Action judges the patch in the base repo; it posts a PR comment carrying the score marker, the one score transport since push ingest was removed in v0.6 per issue 377; sync's tick then filters comments by author, parses and validates, then POSTs to /score itself; scorer is the one writer, landing the score in redis via srh monotonically; the app then reads GET /leaderboard and composes the overlay pipeline (module-contributions, then team-standings, then hint-penalties, then score adjustments last) before rendering. The score marker is trust-authoritative and only ever comes from the judge's own output, never from the PR checkout.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="512" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="511" rx="10" fill="none" stroke="var(--border)"/>

  <text x="40" y="34" font-size="10" fill="var(--text-muted)" letter-spacing="1">OUTSIDE YOUR BOX &#183; CONTESTANT + GITHUB</text>
  <rect x="40" y="42" width="800" height="130" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="6 4"/>

  <text x="40" y="208" font-size="10" fill="var(--text-muted)" letter-spacing="1">YOUR DOCKER-COMPOSE BOX &#183; CONTAINERS</text>
  <rect x="40" y="216" width="800" height="264" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="6 4"/>

  <rect x="70" y="60" width="190" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="165" y="84" text-anchor="middle" font-size="13" fill="var(--text-bright)">contestant</text>
  <text x="165" y="102" text-anchor="middle" font-size="10" fill="var(--text-muted)">forks target, opens PR</text>

  <line class="dgm-flow" x1="264" y1="87" x2="322" y2="87" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="330" y="60" width="210" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="435" y="84" text-anchor="middle" font-size="13" fill="var(--text-bright)">scoring Action</text>
  <text x="435" y="102" text-anchor="middle" font-size="10" fill="var(--text-muted)">runs in base repo, judges patch</text>

  <line class="dgm-ants" x1="544" y1="87" x2="602" y2="87" stroke="var(--accent-2)" marker-end="url(#arB)"/>

  <rect class="dgm-gate" x="610" y="60" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="710" y="84" text-anchor="middle" font-size="13" fill="var(--text-bright)">PR comment</text>
  <text x="710" y="102" text-anchor="middle" font-size="10" fill="var(--text-muted)">bot-authored score marker</text>

  <line class="dgm-ants" x1="710" y1="118" x2="710" y2="230" stroke="var(--accent-2)" marker-end="url(#arB)"/>
  <text x="722" y="188" font-size="10" fill="var(--accent-2)">the poller</text>
  <text x="722" y="202" font-size="10" fill="var(--accent-2)">pulled every ~30 s</text>

  <rect class="dgm-gate dgm-g2" x="610" y="236" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="710" y="260" text-anchor="middle" font-size="13" fill="var(--text-bright)">sync</text>
  <text x="710" y="278" text-anchor="middle" font-size="10" fill="var(--text-muted)">author &#8594; parse &#8594; validate</text>

  <line class="dgm-ants" x1="606" y1="263" x2="548" y2="263" stroke="var(--accent-2)" marker-end="url(#arB)"/>

  <rect x="330" y="236" width="210" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="435" y="260" text-anchor="middle" font-size="13" fill="var(--text-bright)">scorer</text>
  <text x="435" y="278" text-anchor="middle" font-size="10" fill="var(--text-muted)">POST /score, bearer-authed</text>

  <line class="dgm-ants" x1="326" y1="263" x2="268" y2="263" stroke="var(--accent)" marker-end="url(#arR)"/>

  <rect x="70" y="236" width="190" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="165" y="260" text-anchor="middle" font-size="13" fill="var(--text-bright)">redis</text>
  <text x="165" y="278" text-anchor="middle" font-size="10" fill="var(--text-muted)">via srh &#183; monotonic write</text>

  <text x="165" y="312" text-anchor="middle" font-size="10" fill="var(--accent)">one writer &#183; never un-solved</text>

  <line class="dgm-flow" x1="435" y1="294" x2="435" y2="334" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="447" y="318" font-size="10" fill="var(--text-muted)">GET /leaderboard</text>

  <rect x="330" y="340" width="210" height="48" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="435" y="369" text-anchor="middle" font-size="13" fill="var(--text-bright)">app</text>

  <line class="dgm-flow" x1="435" y1="392" x2="435" y2="414" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="330" y="420" width="210" height="48" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="435" y="449" text-anchor="middle" font-size="13" fill="var(--text-bright)">rendered board</text>

  <text x="560" y="432" font-size="10" fill="var(--text-muted)">overlay, in order:</text>
  <text x="560" y="446" font-size="10" fill="var(--text-muted)">module-contributions &#8594; team-standings</text>
  <text x="560" y="460" font-size="10" fill="var(--text-muted)">&#8594; hint-penalties &#8594; score adjustments</text>

  <text x="40" y="502" font-size="10" fill="var(--text-muted)">the score marker is trust-authoritative &#8212; it only ever comes from the judge's own output, never from the PR checkout</text>
</svg>
