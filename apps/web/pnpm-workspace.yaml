allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floor for a transitive (babel → next, eslint-config-next). pnpm
# would not re-resolve it within range on its own because it is also a peer
# of update-browserslist-db. GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g.
# Drop once every dependant's own range starts at or above 4.28.7.
overrides:
  browserslist: ">=4.28.7"
  # Security pin for the lint toolchain's minimatch (eslint →
  # @typescript-eslint/typescript-estree → minimatch; only lint loads it, though
  # the runtime image copies the whole node_modules, dev dependencies included):
  # exact, per the repo's pinned-dependencies rule, and scoped to major 10 so
  # eslint's own 3.x copy (outside the vulnerable range) is untouched. The fix
  # is a new major, so no dependant's range reaches it and Dependabot cannot
  # bump it. GHSA-g3hv-75wg-m249. Drop once every dependant that resolves
  # minimatch@10 (today typescript-estree, ^10.2.2) has a range starting at or
  # above 11.0.1.
  "minimatch@10": "11.0.1"
  # Security pin for vite's launch-editor (vitest → vite; only tests load it,
  # though the runtime image copies the whole node_modules): exact on both
  # sides, per the repo's pinned-dependencies rule, and keyed to the one
  # vulnerable version the lock resolves, so a newer vite is never pulled
  # back down. Dependabot alerts
  # 25–27 (launch-editor command execution and Windows escaping). Drop once
  # vitest resolves vite at or above 8.1.6 on its own.
  "vite@8.1.3": "8.1.6"
