# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config for OWASP/owasp-ctf-in-a-box.
# Tuned for a PUBLIC, single-maintainer repo: high signal, low volume.
#
# Tuning principles applied here:
#   1. Semantic and security linters ON; style and IaC-policy linters OFF.
#      A style nit you scroll past trains you to scroll past the real one.
#   2. Five pre-merge checks, not thirteen. Every pre-merge check emits a
#      status row on EVERY PR, including "not applicable" — so each one costs
#      vertical space whether or not it fires. Only invariants worth that
#      permanent cost stay.
#   3. Everything else moved into path_instructions, which fire inline, only
#      when the path is in the diff, and cost nothing on unrelated PRs.
#   4. Two invariants were deleted from here entirely because they belong in
#      CI, not in a prompt — see "MOVED TO CI" at the bottom of this file.
#
# Expect roughly 5-15 comments on a normal PR. If a named check exceeds ~30%
# false positives over your first ten PRs, tighten or delete it.

enable_free_tier: true
language: "en-US"

# Max 250 chars, silently truncated beyond that.
tone_instructions: >-
  Be direct, with respect. Be concise. Assume positive intent. Flag actionable issues: bugs, security, logic errors, breaking changes, or a missing test for a security invariant. Skip style nits. No praise. Include a fix.

early_access: true

reviews:
  auto_title_instructions: "Semantic PR title"

  # chill = fewer, higher-signal comments. The single most effective volume
  # control in this file. Do not flip to assertive without also cutting the
  # path_instructions below.
  profile: "chill"

  # true so the error-mode pre-merge checks below submit a request-changes
  # review (a blocking state) rather than a comment — the ratchet the
  # pre_merge_checks header planned once the config had survived ~10 PRs.
  request_changes_workflow: true

  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  estimate_code_review_effort: true
  sequence_diagrams: false
  in_progress_fortune: false
  abort_on_close: true

  # Labels must already exist in the repo — CodeRabbit will not create them.
  # Trimmed to four so setup is one minute, not ten:
  #   security, breaking-change, infrastructure, documentation
  suggested_labels: true
  auto_apply_labels: true
  labeling_instructions:
    - label: "security"
      instructions: >
        Apply when the PR touches the admins allowlist, the scorer's token
        compare, the sync trust filter or login grammar, the flag/answer-key
        secrecy boundary, the Markdown renderer, the origin assertion, rate
        limits, or a workflow running on pull_request_target.
    - label: "breaking-change"
      instructions: >
        Apply when the PR removes or renames a `.env` key (`GITHUB_ORG`,
        `ADMIN_LOGINS`, `SCORE_IMAGE`, `EVENT_URL`, or another key
        `.env.example` lists) or a `ctf:admin:settings` field, a registered
        module id, a ctf:* Redis key name or value shape, the scorer's POST
        /score or GET /leaderboard payloads, GET /api/public/scoring, or a
        ctf-setup.sh subcommand or flag. Apply it equally when a PR
        RE-INTRODUCES a key a release removed — `SCORE_INGEST`, or the judge's
        `SCORE_API`/`SCORE_TOKEN` (push ingest, removed in v0.6 by #377, ADR
        56). Those names are not in `.env.example` any more, so the
        list-membership test above cannot catch them, and bringing one back is
        a contract change in the same way taking one away was.
    - label: "infrastructure"
      instructions: >
        Apply when the PR modifies docker-compose*.yml, a Dockerfile, the
        Caddyfiles, .github/workflows/**, or Terraform.
    - label: "documentation"
      instructions: >
        Apply when the PR changes docs/**, README.md, or the Jekyll site.

  # Single maintainer.
  suggested_reviewers: false
  auto_assign_reviewers: false

  # Off: the semantic and security path_instructions already catch what
  # matters here, and a slop verdict is noise on a single-maintainer repo.
  slop_detection:
    enabled: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "[WIP]"
      - "DO NOT REVIEW"
      - "DO NOT MERGE"
      - "[skip ci]"
      - "[skip-review]"
      - "[no-review]"
      - "chore(release)"

  # CodeRabbit does NOT auto-import .gitignore.
  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!apps/web/src/lib/event-config.generated.ts"
    # NOTE: every entry here must stay negated (a `!` exclusion). CodeRabbit
    # treats ANY positive (non-negated) pattern as an allowlist: the moment one
    # appears, every path that doesn't match it becomes "included by none" and
    # its review is silently SKIPPED. A prior re-include of
    # `scorer/rubric.owasp/PROVENANCE.md` (paired with a `!scorer/rubric.owasp/**`
    # exclusion) did exactly that — it flipped the whole repo into allowlist mode
    # and skipped review on every apps/web PR. The rubric.owasp tree is vendored
    # and pinned, so reviewing it is minor noise; per that block's own fallback
    # ("drop the exclusion rather than lose it"), both lines were removed so the
    # filter stays exclusion-only.
    - "!docs/_site/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.gif"
    - "!**/*.ico"
    - "!**/*.svg"
    - "!**/CHANGELOG.md"
    - "!**/.idea/**"

  # Off: this repo's tests and docs carry deliberate conventions (no
  # testing-library, the differential corpus, the ADR format) that generated
  # content won't know about.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  # Inline, path-scoped guidance. This is where most of the value lives:
  # zero cost on a PR that doesn't touch the path.
  path_instructions:
    - path: "sync/src/**/*.js"
      instructions: |
        Polls forked repos' PR comments and forwards trusted score payloads.
        Processes attacker-influenced input — contestants control their fork
        and their PR. Flag ⚠️ WARNING: <description> — <fix> for:

        Trust filter ordering — any parsing, JSON.parse, regex, or field access
        on a comment body BEFORE the author is checked against
        cfg.commentAuthor. A forged comment must be dropped before its content
        is interpreted.

        Login grammar weakening — any widening of the GITHUB_LOGIN pattern.
        This value becomes a Redis key segment, so it must reject ':',
        whitespace, control characters, and over-long input. If it changes, the
        scorer's copy must change in the same PR.

        Seen-cache keying — keying on comment id alone rather than id AND
        updated_at. The scoring workflow EDITS one comment per target, so
        id-only keying drops the edit carrying the real score.

        Retry semantics — a submit failure that marks a comment seen or
        advances the cursor without a 2xx. A 4xx is a permanent drop and must
        be logged and counted; anything else retries.

        Silent drops — a `continue`, early return, or swallowed catch in the
        per-repo loop with no log line and no counter. Two real scoring outages
        had this exact shape.

        Fail-open direction — isPaused() and getResetAt() must fail OPEN on a
        Redis error. A blip must never freeze ingestion or replay a reset.

        Window logic — outsideWindow here has independent twins in
        apps/web/src/lib/admin-store.ts and scorer/src/store.js. A change to
        one needs the other two in the same PR.

        State-file trust — treating parsed /state/state.json as having a valid
        shape. It is validated and repaired field by field; `ingested` and
        `resetAt` survive a repair that resets `repos`.

    - path: "scorer/src/**/*.js"
      instructions: |
        The single audited writer for score state and the only service that
        judges patches. Flag ⚠️ WARNING: <description> — <fix> for:

        Second writer — a write to score state outside POST /score, or a write
        that is not monotonic and idempotent on replay. Delivery is
        at-least-once; a replayed score is a no-op, never a double-count.

        Token comparison — a bearer check that is not constant-time, or that
        compares raw rather than hashed values.

        Oracle leakage — contestant-visible output (PR comment, score payload,
        HTTP error) carrying failing test names, assertion text, probe
        internals, stack traces, or exploit payloads. Pass/fail and points
        only.

        Author validation — accepting an `author`, `target`, or `solved` value
        not validated against the same grammar sync enforces, before it builds
        a Redis key.

        Pause handling — POST /score returns a retryable 503 while paused and
        fails OPEN on a Redis error, matching sync. Same for the window check,
        whose twins live in sync and the app.

        Report format drift — the judge's report is parsed by score-action
        regexes and by sync's MARKER. A shape change needs both pinned tests
        updated in the same PR.

    - path: "apps/web/src/lib/{quiz,classic,ai}-{store,keys}.ts"
      instructions: |
        These hold the answer keys and flags. Flag
        ⚠️ WARNING: <description> — <fix> for:

        Secrecy boundary — a contestant-reachable function issuing a command
        against ctf:quiz:key, ctf:classic:flag, ctf:classic:flagnorm, or
        ctf:classic:hints before purchase.

        Lua atomicity — moving the already-solved guard, attempt-cap check,
        cooldown check, or price read out of the atomic script into the JS
        pre-check. The pre-check is a cheap early-out; the script is the
        authority and re-reads state at execution time.

        Case handling in Lua — any string.lower, string.upper, or pattern match
        on a flag or answer. Lua's case functions are ASCII-only and would
        disagree with the JS normalizer, producing a challenge nobody can
        solve. Normalization is JS-only, on both authoring and submission.

        Flag pattern-matching — extracting a flag from JSON with a Lua pattern.
        Flags contain braces, quotes, backslashes; compare whole strings.

        Paired writes — writing ctf:classic:flag without ctf:classic:flagnorm
        in the same pipeline, so a challenge could go live with a flagnorm from
        a previous flag.

        Fail direction — quiz and classic gates fail CLOSED on a lookup error
        (don't grade what you can't verify) and OPEN on the pause/window check
        (don't drop a submission a contestant is entitled to make).

        Immutable ids — anything letting an edit rewrite an existing question
        or challenge id. Rewriting one orphans banked points.

        Historical points — recomputing banked points from a challenge's
        current price. Points are captured at solve time.

        Key hygiene — an open-coded `ctf:*` string instead of the shared
        constant. A NEW key holding event-run state must also be added to the
        master reset prefix list; organizer-authored content is deliberately
        excluded and that intent should be stated. Changing the TYPE of a key
        that may exist in a running event fails WRONGTYPE on first write —
        introduce a new key instead.

    - path: "apps/web/src/lib/leaderboard/**"
      instructions: |
        Composed by a fixed overlay pipeline. Flag
        ⚠️ WARNING: <description> — <fix> for:

        Pipeline order — reordering withModuleContributions →
        withTeamStandings → withHintPenalties. Penalties run LAST so the final
        all-module total nets exactly once; running the fold first makes hints
        free for any row whose points arrive later.

        Attributed vs added — secure-development points are ATTRIBUTED
        (already inside entry.points); quiz and classic are ADDED
        (entry.points += ...). Swapping the verbs double-counts or silently
        loses points.

        Team dedupe — summing members' aggregates instead of folding the union
        of their solved items through foldTeamItems. Summing double-counts
        anything two teammates both solved.

        Per-team round trips — a read scaling with team count rather than
        distinct member count. /leaderboard is dynamic and no-store, so this
        bills one REST call per team per page view.

        Coupled reads — a failed cosmetic read (a catalogue used only as a
        denominator) costing points or changing ranking.

        Empty source — a scorer-less event falling back to the mock source
        rather than emptySource. Placeholder rows would be indistinguishable
        from real standings on a board carrying real quiz or classic points.

    - path: "apps/web/src/lib/{admin-store,admin-auth,resolved-modules,hint-store,rate-limit-store,gate-store}.ts"
      instructions: |
        Runtime-override and access-control layer. Flag
        ⚠️ WARNING: <description> — <fix> for:

        requireAdmin direction — must fail CLOSED; an unreachable store denies
        rather than resolving to an empty list. `ADMIN_LOGINS` env admins are
        checked first without touching Redis and stay non-revocable at
        runtime — they are the lockout recovery path. An EMPTY `ADMIN_LOGINS`
        must refuse every login, never fall open to "no allowlist configured,
        let runtime grants decide".

        Override precedence — every reader is override-else-default
        (`settings.x ?? DEFAULT_X`), never the reverse.

        Audit atomicity — a settings change written without its audit line in
        the same script, or a support action not recording both actor and
        target.

        Window logic divergence — outsideWindow here has independent twins in
        scorer/src/store.js and sync/src/redis.js. All three must change
        together.

        Units — classicCooldownSec is SECONDS; quizRetryAfterMin,
        hintsUnlockAfterMin, scoreCooldownMin are MINUTES. Flag a new knob
        whose name and unit disagree, or a conversion assuming a neighbour's
        unit.

        Reset scope — a prefix list that sweeps organizer-authored content
        (questions, key, challenges, flag hashes, categories, admin settings).
        A reset clears event-run state only. Sponsors (ctf:sponsors,
        ctf:sponsors:logo — issue #405, ADR 57) are the one documented
        exception: unlike a challenge, a sponsor list has no `enabled` toggle
        to fall back to and is scoped to ONE event run by design (last year's
        sponsors are not implicitly this year's), so the master reset clears
        both hashes outright. Do not flag that pair specifically; do flag any
        OTHER content hash added to RESET_PREFIXES without the same kind of
        stated reason.

        Cap removal — AUDIT_CAP, ACTIVITY_LOG_MAX, MAX_CONTESTANTS bound
        unbounded reads and writes. Flag removal, a large unjustified increase,
        or a truncation not reported in `caveats`.

    - path: "apps/web/src/lib/{bootstrap-env,enabled-modules,enabled-apps,resolved-modules,site}.ts"
      instructions: |
        The bootstrap plane and the request-scoped settings read (config v2,
        #386 / ADR 55; docs/reviewing.md section 10). Flag
        ⚠️ WARNING: <description> — <fix> for:

        Leaked bootstrap plane — `bootstrap-env.ts` losing its `server-only`
        import, or an export of it re-exported from a module a client component
        can reach. A client bundle must never carry who the admins are, and
        `process.env` is empty or misleading there anyway.

        Second settings read — a runtime `/admin` setting read outside the
        `cache()`-memoized `getAdminSettingsSnapshot` (`enabled-modules.ts`,
        imported by `resolved-modules.ts`, `enabled-apps.ts` and `site.ts`).
        Two independent reads in one request can disagree on an unlucky Redis
        blip; the memoized snapshot is what makes it once per request.

        Baked bootstrap value — a `GITHUB_ORG`/`ADMIN_LOGINS`/`SCORE_IMAGE`
        default reintroduced as a build-time constant or a generated module.
        These are runtime environment reads; no image takes a config build-arg.

    - path: "apps/web/src/**/*.tsx"
      instructions: |
        Flag ⚠️ WARNING: <description> — <fix> for:

        Client-side bootstrap read — `process.env.ADMIN_LOGINS`,
        `process.env.GITHUB_ORG`, `process.env.SCORE_IMAGE`, or any
        `bootstrap-env.ts` export, reached from a module carrying
        `"use client"` or from anything such a module imports. The admins list
        must never reach a client bundle (config v2, #386; docs/reviewing.md
        section 10).

        Statically prerendered `/` — a `force-static`, a `generateStaticParams`,
        a dropped `force-dynamic`/`revalidate = 0`, or any other change that
        lets the home page be prerendered. The module nav resolves through a
        build-time-unreachable Redis read, so a prerendered `/` bakes that read
        into HTML that never updates without a rebuild. CI asserts
        `apps/web/.next/server/app/index.html` does NOT exist (ci.yml's `app`
        job); a change here must keep that true.

    - path: "apps/web/src/app/api/**"
      instructions: |
        Flag ⚠️ WARNING: <description> — <fix> for:

        Identity from the body — deriving `login` or any identity from the
        request body, query string, or a header rather than the session.

        Missing admin gate — a route reading per-contestant data (points,
        attempts, hint spend, team membership, answer keys, flags, metrics)
        without requireAdmin. Carve-out: a route reading ONLY the
        authenticated caller's OWN row, where that identity is
        cryptographically bound — a verified launch token's `sub`, or a
        session login — is self-service, not an admin surface; GET
        /api/ai/state is the example. Reading ANY OTHER contestant's data
        still requires requireAdmin.

        Oracle ordering — running the team check or pre-event gate AFTER
        parsing or evaluating a submission, so the refusal reveals whether the
        answer was correct. Refuse before the body is interpreted.

        Public surface growth — GET /api/public/scoring, GET
        /api/ai/launch-key, GET /api/board/items and GET
        /api/sponsors/logo/[id] are the ONLY sanctioned unauthenticated GET
        routes, and POST /api/gate (the pre-event password check: per-IP
        attempt budget charged before the compare, pass/fail only) and POST
        /api/stats/visit (the no-PII per-country reach counter, always 204)
        the ONLY sanctioned unauthenticated POSTs — the same six
        docs/reviewing.md invariant 11 names. The GETs must stay read-only,
        policy or public-by-design content out and never facts in, with
        nothing secret in the payload: launch-key publishes the launch
        PUBLIC key, its `kid` and the algorithm, with the private half
        import-forbidden by the ai contract test; board/items serves the
        public leaderboard's expansion (who solved what — already on the
        board as counts) built only from the contestant-safe listers, ids and
        banked points, capped at a team roster's worth of logins per request;
        sponsors/logo/[id] (issue #405, ADR 57) serves only PNG/WebP bytes an
        organizer explicitly uploaded to be shown publicly, already sniffed
        by magic number at upload (never SVG), keyed by an id validated
        against SPONSOR_ID_RE before any Redis command — it exists so a
        contestant's browser never fetches a sponsor's logo from the
        sponsor's own CDN and leaks that contestant's IP to the sponsor.
        Flag any OTHER new unauthenticated route, any secret appearing in any
        of the four payloads, and anything letting a fork report facts to
        the box rather than only read policy from it.

        Origin assertion bypass — a mutating route opting out of the
        same-origin check in src/proxy.ts, or a widening of the /api/auth/*
        exclusion.

        Rate-limit keying — keying a post-auth limit on IP rather than the
        authenticated login. Caddy appends to x-forwarded-for, so IP is
        spoofable.

    - path: "apps/web/src/lib/markdown.ts"
      instructions: |
        Hand-rolled Markdown subset, deliberately not a library (see the ADR).
        Flag ⚠️ WARNING: <description> — <fix> for:

        Any dangerouslySetInnerHTML, innerHTML, or HTML-string return path. The
        parser produces a typed node tree rendered into React elements, so
        injected markup is structurally impossible rather than filtered.

        Scheme allowlist weakening beyond http:, https:, mailto:. Control
        characters and whitespace must be stripped BEFORE scheme parsing (so
        `java\tscript:` cannot slip through), and scheme-relative `//host` must
        stay rejected.

        Raw HTML passthrough, attribute passthrough, or `data:` URI support.

    - path: "{setup,scripts}/**/*.sh"
      instructions: |
        Organizer-facing shell. Flag ⚠️ WARNING: <description> — <fix> for:

        Missing `set -euo pipefail`, or an error path that exits 0.

        Fail-open parsing — an unparseable or unexpected `.env` value (via
        `env_val`) or wizard answer resulting in "nothing to do" rather than a
        loud non-zero exit. The org and doctor subcommands fail CLOSED.

        Secret exposure — echoing a token, App key, or REDIS_PASSWORD; passing
        a secret as a command-line argument (visible in ps); writing one to a
        file without restrictive permissions.

        Non-idempotent provisioning — a step that breaks or duplicates on a
        second run. ctf-setup.sh is expected to be re-runnable.

        Generated secrets with insufficient entropy or a predictable source.

        (shellcheck covers quoting; don't duplicate its findings.)

    - path: ".github/workflows/**"
      instructions: |
        Flag ⚠️ WARNING: <description> — <fix> for:

        pull_request_target misuse — the scoring workflow template
        (scorer/consumer-workflow.example.yml) uses pull_request_target
        DELIBERATELY, so the judge runs in the base repo's context where the
        org secrets live. Do NOT flag pull_request_target by itself, and do not
        restate a zizmor finding about it. DO flag: a checkout of the PR head
        ref in a secret-bearing job; a step that executes, builds, sources, or
        installs contestant-supplied code in a secret-bearing job; a secret
        interpolated into a `run:` string reachable by PR-controlled input; and
        `${{ github.event.* }}` values interpolated into shell without quoting.

        Action pinning — a third-party action by tag or branch rather than a
        full commit SHA. First-party `actions/*` may use a tag if that's the
        existing convention; flag a mix within one workflow.

        Permissions — a workflow or job with no explicit `permissions:` block,
        or write scopes it doesn't use.

        The `changes` path gate — when this PR adds a source path, changes a
        job's scope, or moves code between areas, check the gate still routes
        that path to every job it can break. A change breaking a job the gate
        won't run is this gate's characteristic failure.

        Soft failures — `|| true`, `continue-on-error: true`, or a
        non-failing step on anything that exists to prove correctness.

        Dependabot coverage — a new manifest directory (package.json,
        Dockerfile, Terraform) with no matching `updates:` entry in
        .github/dependabot.yml. The digest-pinning ADR only holds if something
        keeps bumping the pins.

    - path: "{**/package.json,**/Dockerfile,**/*.tf,.github/dependabot.yml}"
      instructions: |
        Supply chain. Flag ⚠️ WARNING: <description> — <fix> for:

        Unpinned versions — npm/pnpm ranges (^, ~, *, >, >=, "latest"); a
        Docker image on :latest, no tag, or a tag without a digest; a Terraform
        provider or module with no version constraint. Digest pinning is a
        documented decision here, so an unpinned image is a regression, not a
        style choice. Warn if the matching lockfile (pnpm-lock.yaml,
        package-lock.json, .terraform.lock.hcl) wasn't committed alongside.
        This repo has several package.json files — check the one that changed.

        Overrides — a new or changed "overrides"/"resolutions"/"pnpm.overrides"
        entry with no explanation of why a transitive version is forced.

        NEW dependency provenance — a dependency or base image that did not
        exist on the base branch, with no reason given in the PR description.
        Ask for: why it's needed and why nothing already here covers it (this
        project prefers few dependencies and hand-rolled where the surface is
        small); a typosquat comparison against the popular package with a
        similar name; publisher age and maintainer count if it looks thin; and
        whether it's runtime or dev-only — a new runtime dependency in
        apps/web, sync, or scorer is a bigger decision. Do not flag
        well-known packages merely for being new to this repo, and do not flag
        Dependabot's own bumps of existing dependencies.

        Install-time execution — a new preinstall/install/postinstall script; a
        `curl ... | bash` in a Dockerfile, workflow, setup script, or Terraform
        user_data; a local-exec/remote-exec provisioner fetching and running a
        remote script. Prefer a pinned, checksum-verified download then a
        separate execute step.

        Terraform specifics — this is an ephemeral apply-up/destroy-down box,
        so do NOT flag missing encryption at rest, backup retention, or flow
        logs. DO flag: ingress wider than the event needs, secrets in plaintext
        variables or user_data, a variable carrying a token without
        `sensitive = true`, wildcard IAM actions or resources, and resources
        that survive `destroy` and keep billing.

    - path: "{docker-compose*.yml,caddy/Caddyfile*}"
      instructions: |
        Flag ⚠️ WARNING: <description> — <fix> for:

        Network split — srh must remain the ONLY service on both networks, so
        app, scorer and sync have no route to redis:6379 and cannot bypass
        srh's bearer token. The backend network stays `internal`. Flag any
        service gaining a second network, or redis being exposed.

        Required-variable syntax — REDIS_PASSWORD and other secrets use
        compose's `:?` form so a missing value fails bring-up rather than
        quietly starting unauthenticated.

        Profiles — a service's `profiles:` no longer matching the modules that
        need it. scorer and sync both carry ["secdev"] and nothing else. The
        `secdev` profile is DERIVED, never a second knob: whoever brings the
        stack up adds it iff SCORE_IMAGE is non-empty (scripts/dev-stack,
        deploy/fly/render-compose.sh, ctf-setup.sh's wizard step 8). A
        quiz-only or classic-only event must never be required to pull the
        private scorer image.

        Caddyfile.poll gaining a /score route, or any route giving the box
        inbound scoring surface. It is the only Caddyfile: push ingest and
        Caddyfile.push were removed in v0.6 (#377, ADR 56), so a /score route
        reintroduces a transport this kit deliberately deleted.

        Restart policy — sync uses `restart: on-failure`, not
        `unless-stopped`, so its clean exit-0 no-op on a module-less event
        isn't restarted as if it crashed.

    - path: "{sync,scorer}/test/**,apps/web/**/__tests__/**,setup/test/**,scripts/acceptance-*.sh,scripts/smoke.sh"
      instructions: |
        Flag ⚠️ WARNING: <description> — <fix> for:

        Weak assertions — asserting only that a function was called, that a
        result is truthy, or that nothing threw, where the point is a specific
        value or a specific refusal.

        Tautologies — computing the expected value with the same expression
        production uses, or mocking the unit under test.

        Missing fail-direction coverage — a gate's happy path with no companion
        test injecting a store error and asserting its documented direction.

        Time coupling — dependence on the machine's timezone, local midnight, a
        DST boundary, or a real sleep. Cooldowns and windows use injected time.

        Corpus asymmetry — a fixture in setup/test/corpus/ that only one of the
        two readers asserts against. The corpus exists so the bash and JS
        parsers agree; a one-sided fixture defeats it.

        Vacuous acceptance assertions — one that would pass against an empty
        page, a 200 with an error body, or a container that is merely up.

    - path: "{.coderabbit.yaml,docs/reviewing.md}"
      instructions: |
        These two files are a documented lockstep pair: docs/reviewing.md is
        the reader-facing review guideline and this config is its
        machine-enforced subset (the doc's own Section 3 says so). Flag
        ⚠️ WARNING: <description> — <fix> when a PR changes one file's review
        RULES — a path instruction, a pre-merge check, an invariant, a fail
        direction, a "what not to flag" entry — without a corresponding change
        in the other, and without the PR description stating why the change is
        legitimately one-sided. Typo, formatting, and comment-only edits are
        one-sided by nature and are fine. A guideline the bot doesn't enforce,
        or a bot rule no document explains, is how the two drift apart.

    - path: "docs/**/*.md"
      instructions: |
        These docs are the spec and are published. They make unusually specific
        claims — exact key names, regexes, defaults, caps, units, which reader
        touches which key, CI job names, compose profiles, per-target totals.
        Flag ⚠️ WARNING: <description> — <fix> for:

        A statement contradicted by code in this PR, with both lines cited.

        A capability described as working that depends on an unlanded upstream
        change, without that dependency stated.

        A new ADR superseding an existing one without the superseded entry
        marked, or an ADR numbering gap or reuse.

        A heading rename breaking an anchor linked from another doc, README.md,
        or the Jekyll site; a relative link that resolves on GitHub but not on
        the Jekyll site, or vice versa.

        Prose style, grammar, and line length are NOT in scope. Do not comment
        on them.

  # Five checks. Each costs a status row on every PR, so the bar is: an
  # invariant whose violation is silent, expensive, and not caught by CI.
  # The first and third run at mode: error (paired with
  # request_changes_workflow: true above) — the ratchet planned at adoption,
  # pulled once the config had survived 15+ PRs. The other three are warnings.
  #
  # The dividing line, after #241: a check blocks only if it judges CODE against
  # a mechanical rule. "Breaking Change Documentation" judges the PR description
  # — prose, scored from a snapshot taken at review time — so it warns instead.
  # See its own comment for what that cost before the demotion.
  pre_merge_checks:
    description:
      mode: warning
    issue_assessment:
      mode: "off"

    custom_checks:
      - name: "Contestant Secrecy Boundary"
        mode: error
        instructions: |
          The central security property: a contestant must never obtain a quiz
          answer key, a classic flag, or unpurchased hint text through any
          contestant-reachable path.

          Trigger condition — the PR touches apps/web/src/lib/quiz-store.ts,
          classic-store.ts, ai-store.ts, quiz-keys.ts, classic-keys.ts,
          ai-keys.ts, ai-io.ts, hint-store.ts, any
          route under apps/web/src/app/api/, any page or component rendering
          questions, challenges, or the leaderboard, or the leaderboard overlay
          pipeline. If it touches none of these, report Passed with the reason
          "not applicable".

          Flag ⚠️ WARNING: <description> — <fix> for:

          A contestant-reachable function issuing a Redis command against
          ctf:quiz:key, ctf:classic:flag, ctf:classic:flagnorm, ctf:ai:flag,
          ctf:ai:flagnorm, ctf:ai:signkey, the private half of
          ctf:ai:launchkey, or ctf:classic:hints / ctf:ai:hints for an
          unpurchased hint.

          A type reachable from a contestant-facing component gaining a field
          that could carry a correct answer, a flag, or hint text.

          An admin-only read (GET /api/admin/quiz, GET /api/admin/classic, the
          metrics fold, support ops) losing requireAdmin or becoming reachable
          from a contestant route.

          A new field on the activity log's `detail`, an error message, or a
          metrics payload that could carry a flag, an answer, hint text, or a
          per-contestant identifier that wasn't there before.

          A response that differs observably between "wrong answer" and
          "refused for another reason", turning the refusal into an oracle.

          Required with any such change: a test pinning the boundary from BOTH
          sides — the store not issuing the command, and the rendered output
          not carrying the value. One guard is not coverage.

      - name: "Fail-Open vs Fail-Closed Direction"
        mode: warning
        instructions: |
          Every gate here has a deliberate failure direction, and the
          directions deliberately differ. An inversion is silent — it surfaces
          only during a Redis blip in a live event.

          Trigger condition — the PR adds or modifies a gate, guard, or
          availability check, or a try/catch around a store read feeding one.
          Otherwise report Passed with the reason "not applicable".

          FAIL OPEN (a store error lets the action proceed) — the pause and
          scheduled-window checks in app, scorer and sync; the no-team check on
          scoring routes; getResolvedModules; the activity-log writer (a lost
          log line must never fail the action it describes); the post-auth rate
          limits on /api/team/join and /api/hints/reveal.

          FAIL CLOSED (a store error refuses) — requireAdmin; the quiz
          attempt/answer lookup; the classic cooldown lookup; the pre-event
          gate throttle in gate-store; ctf-setup.sh's `.env` parsing
          (`env_val`); an empty `ADMIN_LOGINS` in `parseAdminLogins`/
          `admin-auth.ts`; sync's `loadConfig(env)` refusing on a missing
          `GITHUB_ORG`.

          Flag ⚠️ WARNING: <description> — <fix> when a change inverts one of
          these, when a NEW gate is added without its direction stated in a
          comment and justified, or when a direction changes without a test
          that injects a store error and asserts the new direction.

      - name: "Unpinned Dependencies & Actions"
        mode: error
        instructions: |
          Trigger condition — only evaluate ecosystems whose manifest,
          lockfile, Dockerfile, workflow, or Terraform file changed in this
          diff. If none changed, report the standalone status Passed, not
          Inconclusive, with "not applicable" as the reason text rather than
          folding it into the status.

          Flag ⚠️ WARNING: <description> — <fix> for:

          npm/pnpm — a version using ^, ~, *, >, >=, or "latest"; a missing or
          uncommitted lockfile alongside a manifest change. Several package.json
          files exist (apps/web, sync, scorer); check the one that changed.

          Docker — an image on :latest, no tag, or a tag without a digest. Also
          an OS package install (apt-get install, apk add) with no per-package
          version. Treat a backslash-continued RUN as one logical command, and
          a package argument built from a shell or build-arg expansion as
          unresolved.

          GitHub Actions — a third-party action by tag or branch rather than a
          full 40-character commit SHA.

          Terraform — a provider or module with no pinned version constraint; a
          missing or uncommitted .terraform.lock.hcl.

          Any other manifest present in the diff — accept an exact version,
          commit SHA, content digest, or local path as pinned; flag a
          comparison operator, wildcard, range, branch reference, or
          "latest"-style meta-version.

      - name: "Breaking Change Documentation"
        # warning, not error, and the demotion is deliberate.
        #
        # This check judges PROSE — whether the PR description says enough about
        # a contract change — while the other two `error` checks judge code
        # against a mechanical rule (a Redis command against a secret key; an
        # unpinned dependency). A prose judgement is the one most likely to be
        # wrong, and with `request_changes_workflow: true` a wrong one is a hard
        # merge block on a PR whose code is fine.
        #
        # It happened on #241: the check kept reporting "event.yaml.example has
        # no diff" and "the description says Breaking changes: None" after both
        # had been fixed — it scores the description captured at review time, and
        # editing the description afterwards does not recompute it. The PR sat
        # blocked on two claims that `gh api .../files` disproved in one command.
        #
        # Demoting keeps the signal exactly where it is useful — it still writes
        # the same finding into the summary, and a real undeclared breaking
        # change is still called out in front of the maintainer — while removing
        # its ability to block on a stale snapshot. The invariant it guards is
        # also not silent elsewhere: the `breaking-change` label rule above fires
        # on the same conditions.
        mode: warning
        instructions: |
          Flag ⚠️ WARNING: <description> — <fix> on a change to a published
          contract without documentation:

          Runtime config schema — removing or renaming a `.env` key
          (`GITHUB_ORG`, `ADMIN_LOGINS`, `SCORE_IMAGE`, `EVENT_URL`, or
          another key `.env.example` lists) or a `ctf:admin:settings` field,
          changing enum membership (module ids, target ids), making an
          optional key required, or re-introducing a key a release removed
          (`SCORE_INGEST` — push ingest, removed in v0.6 by #377).
          `.env.example`, `ctf-setup.sh`'s wizard, and the docs must change
          too.

          Module contract — anything in docs/modules.md a third-party module
          implements against.

          Scorer HTTP surface — POST /score or GET /leaderboard shapes,
          including fields the app treats as additive (`catalog`, `solvedIds`).
          Removing an additive field breaks an older app; adding a required one
          breaks an older scorer.

          GET /api/public/scoring — consumed by an Action inside a contestant's
          fork, which cannot be redeployed with the box. Breaking by default.

          Redis key names or value shapes — an event mid-run has data under the
          old names; say what happens to it.

          ctf-setup.sh — removing or renaming a subcommand, flag, or prompt.

          Environment variables — removing or renaming GITHUB_ORG,
          ADMIN_LOGINS, EVENT_URL, SCORE_IMAGE, LEADERBOARD_API_URL,
          LEADERBOARD_SOURCE, UPSTASH_REDIS_REST_URL, DEMO_MODE, or similar.
          Re-introducing SCORE_INGEST, or the judge's SCORE_API/SCORE_TOKEN,
          counts too: push ingest was removed in v0.6 (#377) and a diff that
          brings the key back is proposing a second score transport.

          Required: a "Breaking changes" section in the PR description saying
          what changed and what an organizer or module author must update, plus
          an upgrade note for an event already running.

          Acceptable: additive fields with a documented fallback (the way
          `catalog`/`solvedIds` degrade to counts on an older scorer);
          backwards-compatible aliases; a deprecation period with a stated
          removal version.

      - name: "Secrets & Challenge Data in Logs"
        mode: warning
        instructions: |
          Flag ⚠️ WARNING: <description> — <fix> on any line emitting a log,
          stack trace, error message, PR comment, or admin-visible record that
          may include:

          Event secrets — the scorer bearer token, the SRH token, the GitHub
          App private key or installation token, the OAuth client secret,
          REDIS_PASSWORD, or a join code.

          Challenge secrets — a flag (authored or normalized), a quiz answer
          key, or hint text. Includes anything written to ctf:admin:audit or
          ctf:activity:log, whose `detail` carries ids and slugs only, and
          anything echoed back in an API error.

          Full-object logging — console.log(req.body), JSON.stringify(payload),
          an entire GitHub API response or comment body, where the payload
          isn't explicitly allowlisted.

          Unsanitized errors — an exception message or stack trace on a path
          that may carry a submitted flag, an answer, a token, or a URL with a
          token in it. In apps/web/src/lib/*-store.ts the caught value is
          never a log argument: the stores log errorLabel(err) from
          lib/error-label.ts (name + capped message, no stack, no own
          properties). A raw `err`, String(err) or JSON.stringify(err) handed
          to console.* there is the finding.

          Base64 blobs — GITHUB_APP_PRIVATE_KEY, an Authorization header
          value, or any long base64-looking string written to a log. Base64 is
          encoding, not encryption. Acceptable: a short fingerprint (first 6
          chars plus length).

          Acceptable: structured logging with explicit field allowlists,
          redaction at the logger level, correlation ids not derived from a
          login, and the deliberate per-repo tick summary reporting counts
          rather than content.

  # Rule applied here: semantic and security analysis ON, style and
  # policy-template linters OFF. Style findings are exactly the comments you
  # learn to scroll past, and scrolling past is the failure mode.
  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    hadolint:
      enabled: true
    github-checks:
      enabled: true
    opengrep:
      enabled: true
    osvScanner:
      enabled: true
    trufflehog:
      enabled: true
    # Actions security auditing — directly relevant to the pull_request_target
    # scoring workflow. Expect it to flag the template anyway; that's the tool,
    # not the prompt. If it does so on every workflow PR, disable it and rely
    # on the .github/workflows path instruction above.
    zizmor:
      enabled: true

    # --- Off, deliberately ---
    # Style-only on a doc-heavy repo: line length, heading style. High volume,
    # near-zero signal.
    markdownlint:
      enabled: false
    # Style-only; would fire on compose and workflow formatting. actionlint
    # covers the semantic half.
    yamllint:
      enabled: false
    # Grammar checking on docs dense with `flagnorm`, `ctf:quiz:key` and
    # `pull_request_target`.
    languagetool:
      enabled: false
    # Policy templates written for long-lived cloud infra. On an ephemeral
    # apply-up/destroy-down box it would demand encryption at rest, backups and
    # flow logs on every Terraform PR, and be wrong every time. The Terraform
    # guidance in path_instructions covers what actually matters here.
    checkov:
      enabled: false
    # Overlaps osvScanner for dependency CVEs and checkov for IaC misconfig.
    trivy:
      enabled: false
    # Superseded by opengrep; would double-flag.
    semgrep:
      enabled: false
    # No Java or C/C++.
    fbinfer:
      enabled: false
    # Java/Apex/Visualforce only.
    pmd:
      enabled: false
    # Contestant logins are public GitHub handles; would fire on fixture data.
    presidio:
      enabled: false
    # No SKILL.md manifests or MCP configs here today.
    skillspector:
      enabled: false
    # No OpenAPI spec. Enable if one is ever published for the scorer.
    oasdiff:
      enabled: false

knowledge_base:
  opt_out: false

  web_search:
    enabled: true

  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      # The ADRs and the architecture doc are the actual house rules.
      - "docs/**/*.md"

  mcp:
    usage: auto
    disabled_servers: []

  learnings:
    scope: auto

  # Issues carry real design context here and are referenced from the docs.
  issues:
    scope: auto

  pull_requests:
    scope: auto

  # (removed — see note)
  linked_repositories: []

chat:
  auto_reply: true
  art: false
  # Public repo — external contributors need to talk to the bot on their own
  # PRs. With auto_review and enable_free_tier, this is what makes a drive-by
  # contribution reviewable.
  allow_non_org_members: true

code_generation: {}

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    auto_planning:
      enabled: true
      labels:
        - "ready-for-dev"
  labeling:
    auto_apply_labels: true

# --- MOVED TO CI ---
#
# Two invariants were deliberately NOT written as checks here, because they
# can be made deterministic and a deterministic gate beats a probabilistic
# reviewer every time. Both are small:
#
# 1. outsideWindow agreement. A shared corpus of (now, startsAt, endsAt) cases
#    with expected verdicts, asserted from all three implementations
#    (apps/web/src/lib/admin-store.ts, scorer/src/store.js,
#    sync/src/redis.js) — the same pattern setup/test/corpus/ already uses for
#    the modules: parser. This is the single largest untested invariant in the
#    repo and CodeRabbit will only catch it when two of the three files happen
#    to be in the same diff.
#
# 2. Reset-list completeness. A test asserting every event-run key constant
#    exported by the -keys modules appears in the master reset prefix list,
#    with an explicit allowlist for the organizer-authored keys that are
#    deliberately excluded. Adding a key then forgetting the reset entry is
#    otherwise invisible until an organizer resets and finds stale state.
#
# A third worth considering: a type-level test (@ts-expect-error) asserting
# AdminQuestion is not assignable to Question and AdminChallenge is not
# assignable to Challenge. That turns the most important half of the secrecy
# boundary from a review catch into a build failure.
