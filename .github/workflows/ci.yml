name: ci
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job here only checks out and tests — nothing writes
# back to the repo, posts comments, or mints packages. The workflow-level
# default keeps a future job from silently inheriting the org default.
permissions:
  contents: read

# Two rules hold for every step below, and a new job is expected to follow
# them:
#
#   - Every `uses:` is pinned to a full 40-character commit, with the tag kept
#     as a trailing comment. That comment is not decoration: it is what
#     Dependabot's `github_actions` ecosystem reads to keep the pin current, so
#     pinning costs no staleness. Same posture ADR 51 takes for base images.
#   - Every `actions/checkout` sets `persist-credentials: false`. No job here
#     runs `git` after checking out, so the GITHUB_TOKEN checkout would
#     otherwise leave in `.git/config` is never used — it only widens what
#     checked-out code could reach. Exposure is already bounded (the
#     `contents: read` default above, and `pull_request` rather than
#     `pull_request_target`), which is why this is hardening rather than a fix.
#     A job that genuinely needs to push must say so, and say why, instead of
#     inheriting a token by omission.

jobs:
  # Decide which areas a PR actually touches so only the relevant jobs run.
  # Native `git diff` — no third-party action — keeps this self-contained. A push
  # to main (post-merge) sets every area true, so main always gets the full run as
  # a safety net; only PRs are filtered. Each job below `needs: changes` and gates
  # on its output, so an unrelated job is *skipped* (which satisfies a required
  # check) rather than running needlessly.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      scorer: ${{ steps.f.outputs.scorer }}
      sync: ${{ steps.f.outputs.sync }}
      shell: ${{ steps.f.outputs.shell }}
      smoke: ${{ steps.f.outputs.smoke }}
      quiz: ${{ steps.f.outputs.quiz }}
      classic: ${{ steps.f.outputs.classic }}
      ai: ${{ steps.f.outputs.ai }}
      docs: ${{ steps.f.outputs.docs }}
      registries: ${{ steps.f.outputs.registries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            { echo "app=true"; echo "scorer=true"; echo "sync=true"; echo "shell=true"; echo "smoke=true"; echo "quiz=true"; echo "classic=true"; echo "ai=true"; echo "docs=true"; echo "registries=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf 'changed files:\n%s\n' "$changed"
          # Editing this workflow re-runs every area (a CI change is untargeted).
          CI='|^\.github/workflows/ci\.yml$'
          m() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            # setup/targets.tsv is here for the same reason the corpus is on
            # `sync` below: it is the ONLY authoritative source of a fork's
            # repo name (ctf-setup.sh forks with --fork-name derived from it),
            # and both `app` and `sync` keep a copy pinned to it by a
            # differential test. Without this line a PR editing only the tsv —
            # an upstream rename, a new target — runs neither suite, so the one
            # guard that would catch the drift stays silent on the exact commit
            # that causes it.
            # The shared window corpora (test/fixtures/window-corpus.json and
            # scoring-window-corpus.json) are read by the app,
            # scorer AND sync suites — each runs every row against its own
            # copy of the three-reader contract. A corpus-only edit must run
            # all three.
            # caddy/Caddyfile.poll is here because the app's
            # security-headers.test.ts pins Caddy's header block to the same
            # values next.config.ts sends (audit S1); a Caddy-only edit must
            # run the suite that catches the two drifting apart.
            echo "app=$(m "^apps/web/|^caddy/Caddyfile\.poll$|^setup/targets\.tsv$|^scripts/acceptance-app\.sh|^test/fixtures/(scoring-)?window-corpus\.json\$$CI")"
            # sync/src/parse.js rides the scorer filter too:
            # acceptance-scorer.sh imports the REAL parser as the one live
            # cross-check of the marker/grammar contract, so a sync-only PR
            # that changes the grammar must run the suite that proves the
            # scorer still agrees with it.
            echo "scorer=$(m "^scorer/|^sync/src/parse\.js$|^scripts/acceptance-scorer\.sh|^test/fixtures/(scoring-)?window-corpus\.json\$$CI")"
            # setup/targets.tsv is here for the reason given under `app`
            # above: it is the only authoritative source of a fork's repo
            # name, and sync keeps a copy pinned to it by
            # sync/test/repo-names.differential.test.js — the one guard that
            # catches the drift, which must therefore run on the commit that
            # causes it.
            echo "sync=$(m "^sync/|^setup/targets\.tsv|^test/fixtures/(scoring-)?window-corpus\.json\$$CI")"
            # deploy/fly is here because its checks ARE shell: a bats suite
            # plus a shellcheck'd deploy script. There is no `terraform
            # validate` equivalent for fly.toml to give it its own job.
            # scorer/consumer-workflow.example.yml is here because the bats
            # suite pins that file's security posture (the unsafe-checkout
            # opt-in, persist-credentials: false, the workflow version) — a PR
            # "hardening" the template must run the suite that guards it.
            # docker-compose.yml is here because fly.bats renders and asserts
            # on the REAL compose file, not a fixture.
            # deploy/aws-terraform's SCRIPT and its bats suite are shell, so
            # they belong here; the .tf files belong to terraform.yml, which
            # has its own paths filter. Both jobs run when the module changes,
            # and each checks the half the other cannot see.
            # docs/decisions.md, the Makefile, AGENTS.md and CONTRIBUTING.md
            # are here because scripts/test/check-docs-drift.bats pins the ADR
            # index and the local copies of this job's own commands.
            # .nvmrc and every workflow are here for the same check's third
            # rule: each workflow's node-version must equal .nvmrc.
            # The audited apps/web/ files are here because scripts/test/check-comment-policy.bats
            # asserts on them, following the same approach as check-docs-drift above.
            echo "shell=$(m "^scripts/|^setup/|^deploy/fly/|^deploy/aws-terraform/deploy\.sh$|^deploy/aws-terraform/test/|^sync/Dockerfile$|^docker-compose\.yml$|^scorer/consumer-workflow\.example\.yml$|^scorer/entrypoint|^docs/decisions\.md$|^Makefile$|^AGENTS\.md$|^CONTRIBUTING\.md$|^\.nvmrc$|^\.github/workflows/|^apps/web/src/lib/classic-store\.ts$|^apps/web/src/lib/admin-store\.ts$|^apps/web/src/lib/modules\.ts$|^apps/web/src/lib/quiz-store\.ts$|^apps/web/src/lib/ai-store\.ts$|^apps/web/src/lib/leaderboard/module-contributions\.ts$|^apps/web/src/app/\(site\)/admin/admin-controls\.tsx$|^apps/web/src/lib/event-store\.ts$|^apps/web/src/lib/metrics-store\.ts$|^apps/web/src/lib/__tests__/admin-store\.seed\.test\.ts$|^apps/web/src/lib/leaderboard/__tests__/module-contributions\.test\.ts$|^apps/web/src/lib/team-store\.ts$|^apps/web/src/app/\(site\)/admin/__tests__/admin-controls\.test\.tsx$|^apps/web/src/lib/admin-ops-store\.ts\$$CI")"
            # `^sync/` is here because smoke runs the REAL sync service —
            # docker-compose.smoke.yml overrides only its environment. It is
            # the one end-to-end proof the poll pipeline works, so the area
            # most able to break it has to trigger it.
            # Without this a change to the poller's own state handling can
            # merge with the poll-pipeline test skipped.
            #
            # `^scorer/` is deliberately NOT here: the same override file
            # replaces the scorer with test/fixtures/mock-scorer.mjs
            # (`image: !reset null`), so no scorer source change can affect
            # this job. It has its own suites.
            # test/fixtures/ is here because docker-compose.smoke.yml builds
            # BOTH mock services (mock-github, mock-scorer) from it — a fixture
            # change is a smoke-behavior change nothing else runs.
            echo "smoke=$(m "^docker-compose|^scripts/smoke\.sh|^setup/|^sync/|^\.env|^Caddyfile|^scorer/consumer-workflow|^test/fixtures/$CI")"
            # Quiz-only spans BOTH areas it proves compose end to end: the app
            # (module gating, /quiz, /leaderboard) and sync (the
            # refuses-without-GITHUB_ORG contract), plus docker-compose.yml
            # itself (the sync service definition the gate brings up).
            echo "quiz=$(m "^apps/web/|^sync/|^docker-compose\.yml$|^scripts/acceptance-quiz-only\.sh$|^scripts/lib/acceptance-lib\.sh$CI")"
            # classic mirrors quiz's reasoning exactly: it spans the app
            # (module gating, /flags, /challenges 404, /leaderboard) and sync
            # (the refuses-without-GITHUB_ORG contract), plus
            # docker-compose.yml itself.
            echo "classic=$(m "^apps/web/|^sync/|^docker-compose\.yml$|^scripts/acceptance-classic-only\.sh$|^scripts/lib/acceptance-lib\.sh$CI")"
            # ai mirrors quiz's and classic's reasoning exactly: it spans the
            # app (module gating, /ai, /ai/<id>, /challenges+/flags+/quiz
            # 404, /leaderboard) and sync (the refuses-without-GITHUB_ORG
            # contract), plus docker-compose.yml itself.
            echo "ai=$(m "^apps/web/|^sync/|^docker-compose\.yml$|^scripts/acceptance-ai-only\.sh$|^scripts/lib/acceptance-lib\.sh$CI")"
            # The Pages site is built from docs/ ALONE (pages.yml sets
            # `source: docs`), so only docs/ and the publishing workflow can
            # change what ships. README.md is in pages.yml's trigger paths but
            # is not part of the site, so it is deliberately absent here.
            echo "docs=$(m "^docs/|^\.github/workflows/pages\.yml$CI")"
            # The three independently-maintained TARGET lists this check
            # compares, plus the check script itself and this workflow file
            # (either is a behavior change). It compares no MODULE list:
            # config v2 deleted the duplicated KNOWN_MODULES in
            # setup/ctf-setup.sh and left module registration to apps/web
            # alone, so neither that script nor apps/web/src/lib/modules.ts
            # is an input here.
            echo "registries=$(m "^(sync/src/config\.js|apps/web/src/lib/apps\.ts|scorer/src/targets\.js|scripts/check-module-registries\.mjs|\.github/workflows/ci\.yml)$")"
          } >> "$GITHUB_OUTPUT"

  sync-tests:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: sync/package-lock.json }
      - run: npm ci
        working-directory: sync
      - run: npm test
        working-directory: sync

  scorer:
    needs: changes
    if: needs.changes.outputs.scorer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scorer/package-lock.json }
      - run: npm ci
        working-directory: scorer
      - run: npm test
        working-directory: scorer
      - run: ./scripts/acceptance-scorer.sh

  # The vacuous-pass gate (docs/scorer.md, #47). A pass-on-patch test asserts
  # the exploit is BLOCKED, and a target that answers nothing blocks every
  # exploit trivially — so a challenge can score points for a security
  # property nobody verified. The sweep points each target's URL at a stub
  # that is up but useless and fails if ANY challenge still passes.
  #
  # Wired in only now that the count is 0/321: a gate adopted while findings
  # remain is a gate somebody has to disable. Its value is catching the NEXT
  # one, on the PR that introduces it, rather than in an audit months later.
  #
  # No Docker: the stub is an in-process HTTP server, so this is minutes of
  # plain Node, unlike the stock/patched gates that boot real containers.
  vacuous:
    needs: changes
    if: needs.changes.outputs.scorer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scorer/package-lock.json }
      - run: npm ci
        working-directory: scorer
      - run: node tools/vacuous-sweep.mjs
        working-directory: scorer

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      # scripts/dev-stack is listed by name: it has no .sh suffix, so the glob
      # alone would leave the one developer entry point unlinted.
      - run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/dev-stack setup/*.sh scorer/entrypoint.sh sync/docker-entrypoint.sh deploy/fly/deploy.sh deploy/fly/render-compose.sh deploy/aws-terraform/deploy.sh
      # The per-target bring-ups are POSIX sh FRAGMENTS sourced by entrypoint.sh, so
      # they get -s sh (they never run under bash) and SC2034 is excluded: BOOTED and
      # EXTRA_CONTAINERS look unused inside a fragment because it is the sourcing
      # script that reads them. Nothing else is excluded — a finding here is a bug to
      # fix in the script, not a rule to widen.
      - run: shellcheck -s sh --exclude=SC2034 scorer/entrypoints/*.sh
      - run: bats setup/test/
      # Static invariants for the fly.io module: the compose render scopes each
      # credential to the one service that needs it, resolves every service to
      # loopback (including hosts behind URL userinfo), leaves no compose-only
      # `$$` escaping for a shell to mis-expand, and names an image for every
      # service. The render runs for real here (it needs docker compose, which
      # the runner has), but nothing is deployed and no fly account is used —
      # same posture as the terraform job.
      - run: bats deploy/fly/test/
      # The AWS module's stack is checked by `terraform test` in its own job.
      # This covers the one part Terraform cannot see: deploy.sh, which builds
      # and pushes the app image and hands Terraform the tag to apply. There
      # is no build-time config bake (config v2): the app reads
      # GITHUB_ORG/ADMIN_LOGINS from the container's runtime environment, so
      # the script has nothing to bake. Stubs stand in for docker/aws/
      # terraform, so --dry-run's "makes no real call" is asserted rather than
      # assumed, and no AWS account is used here either.
      - run: bats deploy/aws-terraform/test/
      # scripts/check-changelog.sh, the rule changelog.yml enforces on every
      # PR. Each case builds a throwaway git repo, so it needs no fixture.
      # And scripts/check-docs-drift.mjs: the ADR index and the local
      # copies of this job's commands. It is plain Node, pinned to 22 like the
      # rest of the repo.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: bats scripts/test/

  smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/smoke.sh

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: apps/web
      # Lint before test: it needs no Redis and no build — a check only a
      # human remembers to run is not a check.
      - run: corepack pnpm lint
        working-directory: apps/web
      - run: corepack pnpm test
        working-directory: apps/web
      # The grading Lua (classic SUBMIT_SCRIPT, quiz GRADE_SCRIPT, ai
      # AWARD_SCRIPT) is the scoring authority; the mocked suites pin what the
      # stores HAND it, not what it does. Every live suite runs here — the
      # three `*.lua.upstash.test.ts` grading suites and the admin-store,
      # hint-store and team-store `.upstash` suites — against
      # a real Redis behind the same SRH image the box ships, digest-pinned
      # like docker-compose.yml. Throwaway containers on the runner's loopback,
      # so no requirepass. Serial (`--no-file-parallelism`): admin-store wipes
      # the fixed ctf:admin:settings / ctf:admin:audit keys the store reads,
      # and hint-store seeds its policy into that same hash, so those two
      # cannot share one Redis concurrently; every other suite is on
      # run-unique keys. All six gate through live-redis.ts, so
      # CTF_LUA_SUITES_REQUIRED turns "no env, so skip" into a failure for
      # each of them — a gate that quietly skips is not a gate.
      - name: Grading Lua against a real Redis (via SRH)
        run: |
          set -euo pipefail
          docker network create ctf-lua
          docker run -d --name ctf-lua-redis --network ctf-lua \
            redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          docker run -d --name ctf-lua-srh --network ctf-lua -p 8079:80 \
            -e SRH_MODE=env -e SRH_TOKEN="$UPSTASH_REDIS_REST_TOKEN" \
            -e SRH_CONNECTION_STRING=redis://ctf-lua-redis:6379 \
            hiett/serverless-redis-http:latest@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
          i=0
          until curl -sf -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" -H 'Content-Type: application/json' \
                  -X POST "$UPSTASH_REDIS_REST_URL/pipeline" -d '[["PING"]]' | grep -q PONG; do
            i=$((i + 1))
            if [ "$i" -ge 30 ]; then
              echo "FAIL: srh never answered PING"; docker logs ctf-lua-srh; docker logs ctf-lua-redis; exit 1
            fi
            sleep 1
          done
          # `pnpm exec`, not `pnpm test -- <filter>`: pnpm forwards the `--` to
          # vitest, which then ignores the filter and runs EVERY file. The
          # `upstash` filter matches every `*.upstash.test.ts` suite plus the
          # two mocked `upstash.test.ts` files, which need no Redis and are
          # harmless here. The app needs no generated config for any of this —
          # config v2 reads GITHUB_ORG/ADMIN_LOGINS from the environment
          # at runtime, so there is nothing here for an earlier step to have
          # generated.
          corepack pnpm exec vitest run upstash --no-file-parallelism
        env:
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: ci-lua-token
          CTF_LUA_SUITES_REQUIRED: "1"
        working-directory: apps/web
      - run: BETTER_AUTH_SECRET=ci-dummy BETTER_AUTH_URL=http://localhost:3000 corepack pnpm build
        working-directory: apps/web
      # Regression gate: the root layout resolves module nav labels via a
      # Redis read (getResolvedModules), which is unreachable at build time
      # by design (see Dockerfile). If `/` is ever statically prerendered
      # again, that read's build-time fallback gets baked into the HTML and
      # never updates again without a rebuild — a unit test can't catch this,
      # it only shows up in the build output.
      - run: |
          if [ -f .next/server/app/index.html ]; then
            echo "FAIL: / was statically prerendered — module nav would freeze at build time (see src/lib/resolved-modules.ts)"
            exit 1
          fi
          echo "OK: / is not statically prerendered"
        working-directory: apps/web
      - run: ./scripts/acceptance-app.sh

  quiz-only:
    needs: changes
    if: needs.changes.outputs.quiz == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/acceptance-quiz-only.sh

  classic-only:
    needs: changes
    if: needs.changes.outputs.classic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/acceptance-classic-only.sh

  ai-only:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/acceptance-ai-only.sh

  # KNOWN_MODULES/target lists are deliberately duplicated across sync, setup,
  # the app and the scorer (ADR 10) — this compares them and fails if any two
  # disagree. No install, no Docker: it only reads source files already
  # checked out.
  registries:
    needs: changes
    if: needs.changes.outputs.registries == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: node scripts/check-module-registries.mjs

  # Builds the docs site with the SAME action pages.yml publishes with, so a
  # docs change that breaks the site fails the PR instead of landing on main
  # and taking the site down.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Pages site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: docs
          destination: docs/_site
      # `jekyll-relative-links` rewrites cross-page `.md` hrefs to `.html`. It
      # matches with a regex that CANNOT span a newline, so a link whose TEXT
      # wraps across two source lines is silently skipped and ships a literal
      # `.md` href into a site that contains no `.md` files. That renders fine
      # in the GitHub repo view and 404s for every site visitor, and the build
      # itself reports zero warnings.
      - name: No unrewritten .md links survived the build
        run: |
          set -euo pipefail
          bad="$(mktemp)"
          find docs/_site -name '*.html' -print0 | while IFS= read -r -d '' page; do
            links="$(grep -oE 'href="[^"]*"' "$page" | sed -e 's/^href="//' -e 's/"$//' || true)"
            [ -n "$links" ] || continue
            printf '%s\n' "$links" | while IFS= read -r href; do
              # An ABSOLUTE .md URL is the repo's own convention for linking to
              # a file outside docs/ (the Jekyll source root), so it is correct
              # and must not be flagged. Only a RELATIVE .md href means the
              # rewrite was skipped.
              case "$href" in
                http:*|https:*|//*|mailto:*|data:*|javascript:*) continue ;;
              esac
              case "${href%%[#?]*}" in
                *.md) printf '%s -> %s\n' "$page" "$href" >> "$bad" ;;
              esac
            done
          done
          if [ -s "$bad" ]; then
            echo "::error::relative .md href(s) in the built site — the link text almost certainly wraps across a newline, which jekyll-relative-links cannot rewrite. Put the link text on one line."
            cat "$bad"
            exit 1
          fi
          echo "no unrewritten .md links"
      # Catches the other silent failure: a relative link that escapes the
      # Jekyll source root (docs/). `../sync/foo.json` resolves in the repo
      # blob view but points outside the published site, so it 404s there
      # only. Absolute https:// URLs are the repo's convention for those.
      # Both of these are one-line config/include changes whose whole effect is
      # in generated <head> markup, so nothing else would notice if they
      # silently stopped working — a theme bump that drops the head-custom.html
      # include, or a baseurl change that makes og:image site-root-relative
      # (which resolves to the WRONG host on a project page like this one).
      - name: Social card and favicon are present and absolute
        run: |
          set -euo pipefail
          page=docs/_site/index.html
          if ! grep -q 'property="og:image" content="https://' "$page"; then
            echo "::error::og:image missing or not an absolute URL in $page — jekyll-seo-tag needs site.url+baseurl to absolutize docs/_config.yml's \`image\`, and a relative one breaks every social card."
            grep -o '<meta property="og:image"[^>]*>' "$page" || echo "  (no og:image tag at all)"
            exit 1
          fi
          if ! grep -q 'rel="icon"' "$page"; then
            echo "::error::favicon missing from $page — the theme may have stopped including docs/_includes/head-custom.html."
            exit 1
          fi
          echo "og:image and favicon present"

      - name: Every internal link resolves in the built site
        run: |
          set -euo pipefail
          cd docs/_site
          bad="$(mktemp)"
          # This is a PROJECT page, so Jekyll prefixes every root-absolute href
          # with the baseurl (/<repo>). `_site` is the site root, so that prefix
          # has to come off before resolving. Derived from the repo name rather
          # than hardcoded, and stripped only when it actually matches — under a
          # custom domain baseurl is empty and hrefs are bare, which still works.
          base="/${GITHUB_REPOSITORY##*/}"
          find . -name '*.html' -print0 | while IFS= read -r -d '' page; do
            dir="$(dirname "$page")"
            # `|| true` matters: a page with no links at all is perfectly
            # normal, and a non-matching grep under `pipefail` would abort
            # the whole sweep — exiting nonzero while printing nothing, which
            # reads as "broken links" but names none.
            links="$(grep -oE 'href="[^"]*"' "$page" | sed -e 's/^href="//' -e 's/"$//' || true)"
            [ -n "$links" ] || continue
            printf '%s\n' "$links" | while IFS= read -r href; do
              # Filtered with `case`, not `grep`, for the same reason.
              case "$href" in
                ''|'#'*|http:*|https:*|mailto:*|data:*|javascript:*|//*) continue ;;
              esac
              href="${href%%[#]*}"
              href="${href%%[?]*}"
              [ -n "$href" ] || continue
              case "$href" in
                "$base"/*) target=".${href#"$base"}" ;;
                /*)        target=".$href" ;;
                *)         target="$dir/$href" ;;
              esac
              if [ -d "$target" ]; then
                target="${target%/}/index.html"
              fi
              if [ ! -e "$target" ]; then
                printf '%s -> %s\n' "$page" "$href" >> "$bad"
              fi
            done
          done
          if [ -s "$bad" ]; then
            echo "::error::broken internal link(s) in the built site:"
            cat "$bad"
            exit 1
          fi
          echo "all internal links resolve"
