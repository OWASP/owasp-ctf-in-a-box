services:
  scorer:
    image: !reset null
    build: ./test/fixtures
    command: ["node", "mock-scorer.mjs"]
    environment:
      SCORER_TOKEN: ${SCORER_TOKEN}
    ports: ["4000:4000"]

  mock-github:
    build: ./test/fixtures
    command: ["node", "mock-github.mjs"]
    # Required, not cosmetic. The base compose file assigns every service to
    # an explicit network, and a service that declares none joins `default`
    # instead — a THIRD network, isolated from both. Without this line sync
    # (on `frontend`) cannot resolve mock-github at all, and the smoke run
    # fails with nothing but "fetch failed" to go on.
    networks: [frontend]

  sync:
    environment:
      GITHUB_API_URL: http://mock-github:8080
      POLL_INTERVAL_MS: "1000"
