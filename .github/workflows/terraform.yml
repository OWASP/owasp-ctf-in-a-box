# Validates the AWS Terraform module on any change to it. Never applies infra —
# fmt + init(-backend=false) + validate + test only. Real applies are run by an
# operator locally (see docs/aws.md); this just keeps the module well-formed
# and its rendered bring-up script correct.
name: Terraform

on:
  push:
    branches: [main]
    paths: ["deploy/aws-terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["deploy/aws-terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws-terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.8"
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate
        run: terraform validate -no-color
      # validate never inspects RENDERED output, so it passed this module for
      # its entire life while the EC2 bring-up script was broken. Fargate has
      # no user-data to render; what these tests render at plan time via
      # mock_provider is the CONTAINER DEFINITIONS — that srh alone may reach
      # ElastiCache, that the connection is rediss:// and not redis://, that no
      # secret is baked in as plaintext instead of a valueFrom, and that
      # scorer/sync appear only for the modules the event actually runs.
      # No AWS credentials, no network, no apply.
      - name: test
        run: terraform test -no-color

  # stack.tftest.hcl pins the srh health check to srh-healthcheck.sh, but a
  # string assertion cannot tell a working probe from one that can never pass:
  # the first version called `GET /ping`, which the pinned srh answers with a
  # 404, and every mocked test was green over it (#476). This job EXECUTES the
  # file inside the pinned srh image against a real Redis. The suite skips
  # without docker locally; SRH_HEALTHCHECK_REQUIRED=1 turns that skip into a
  # failure here, so CI cannot pass it by not running it.
  srh-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: lint the health check as the POSIX sh ECS runs it with
        run: shellcheck -s sh deploy/aws-terraform/srh-healthcheck.sh
      - name: execute the health check against the pinned srh
        env:
          SRH_HEALTHCHECK_REQUIRED: "1"
        run: bats deploy/aws-terraform/test/srh-healthcheck.bats
