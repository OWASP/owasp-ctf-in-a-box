<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">Jeopardy data flow</title>
  <desc id="desc">A contestant submits a flag; a cheap JS pre-check runs first, failing open on a paused or out-of-window read but closed on a cooldown-lookup error; the real authority is one atomic SUBMIT_SCRIPT that rechecks the already-solved guard and cooldown against fresh state, compares the flag's normalized form, and on a match writes the solve row and bumps the aggregates; Jeopardy points are ADDED to the leaderboard, never attributed, and a team's total is the union of its members' solved challenges, never their sum.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="330" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="329" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="20" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">RUNTIME &#183; MOSTLY INSIDE ONE APP CONTAINER</text>

  <rect x="40" y="52" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="140" y="76" text-anchor="middle" font-size="13" fill="var(--text-bright)">contestant</text>
  <text x="140" y="94" text-anchor="middle" font-size="10" fill="var(--text-muted)">submits a flag</text>

  <line class="dgm-flow" x1="244" y1="79" x2="292" y2="79" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="300" y="52" width="240" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="420" y="76" text-anchor="middle" font-size="13" fill="var(--text-bright)">JS pre-check</text>
  <text x="420" y="94" text-anchor="middle" font-size="10" fill="var(--text-muted)">cheap early-out, non-atomic</text>

  <line class="dgm-flow" x1="544" y1="79" x2="592" y2="79" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect class="dgm-gate" x="600" y="52" width="240" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="720" y="76" text-anchor="middle" font-size="13" fill="var(--text-bright)">atomic SUBMIT_SCRIPT</text>
  <text x="720" y="94" text-anchor="middle" font-size="10" fill="var(--text-muted)">recheck fresh &#183; compare flagnorm</text>

  <path class="dgm-ants" d="M720 110 L720 184" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>
  <text x="732" y="152" font-size="10" fill="var(--accent)">on a match</text>

  <rect x="600" y="190" width="240" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="720" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">redis</text>
  <text x="720" y="232" text-anchor="middle" font-size="10" fill="var(--text-muted)">solve row + aggregates bumped</text>

  <line class="dgm-flow" x1="596" y1="217" x2="548" y2="217" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="300" y="190" width="240" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="420" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">leaderboard overlay</text>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="var(--text-muted)">ADDS points, never attributed</text>

  <line class="dgm-flow" x1="296" y1="217" x2="248" y2="217" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="40" y="190" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="140" y="214" text-anchor="middle" font-size="13" fill="var(--text-bright)">team total</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="var(--text-muted)">union of members</text>

  <rect x="300" y="122" width="240" height="44" rx="6" fill="none" stroke="var(--border)" stroke-dasharray="4 4"/>
  <text x="420" y="140" text-anchor="middle" font-size="10" fill="var(--text-muted)">paused / window: fails OPEN</text>
  <text x="420" y="156" text-anchor="middle" font-size="10" fill="var(--text-muted)">cooldown lookup: fails CLOSED</text>
  <line x1="420" y1="110" x2="420" y2="118" stroke="var(--border)" stroke-dasharray="3 3"/>

  <text x="40" y="284" font-size="10" fill="var(--text-muted)">the atomic script is the scoring authority &#8212; the JS pre-check is a cheap early-out, never the decision</text>
  <text x="40" y="300" font-size="10" fill="var(--text-muted)">a team's total is the union of its members' solved challenges, never their sum</text>
</svg>
