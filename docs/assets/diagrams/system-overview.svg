<svg viewBox="0 0 880 512" xmlns="http://www.w3.org/2000/svg" width="100%" role="img" aria-labelledby="ttl desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="ttl">System overview</title>
  <desc id="desc">One docker-compose box at runtime. The contestant browser reaches caddy over HTTPS; caddy proxies to the app; the app reads teams and hints from srh and the leaderboard from scorer; scorer is the one writer for secure-development score state, landing it in redis via srh; secure-development scores arrive one way, by sync polling GitHub and posting to scorer directly, the push tile where a scoring Action posted to /score having been removed in v0.6 per issue 377. Quiz, Jeopardy and AI score entirely app-side and never touch scorer.</desc>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --border: #d0d7de;
      --text-bright: #1f2328; --text: #424a53; --text-muted: #656d76;
      --accent: #0f7a5a; --accent-2: #0757ba; --accent-3: #8a4b00; --accent-4: #5b32b0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --surface: #161b22; --surface-2: #21262d; --border: #30363d;
        --text-bright: #f0f6fc; --text: #c9d1d9; --text-muted: #8b949e;
        --accent: #56d4a4; --accent-2: #58a6ff; --accent-3: #ffa657; --accent-4: #d2a8ff;
      }
    }
    .dgm-flow { stroke-dasharray: 5 5; animation: dgm-flowdash 1.1s linear infinite; }
    .dgm-ants { stroke-dasharray: 5 5; animation: dgm-antsdash 2.2s linear infinite; }
    .dgm-gate { animation: dgm-lit 4s ease-in-out infinite; }
    .dgm-g2 { animation-delay: .35s; }
    .dgm-g3 { animation-delay: .7s; }
    .dgm-g4 { animation-delay: 1.05s; }
    .dgm-g5 { animation-delay: 1.4s; }
    @keyframes dgm-flowdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-antsdash { to { stroke-dashoffset: -20; } }
    @keyframes dgm-lit {
      0%, 100% { stroke: var(--border); }
      10%, 22% { stroke: var(--accent); }
      40% { stroke: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dgm-flow, .dgm-ants, .dgm-gate { animation: none; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent-2)"/>
    </marker>
  </defs>

  <rect width="880" height="512" rx="10" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="879" height="511" rx="10" fill="none" stroke="var(--border)"/>

  <text x="440" y="14" text-anchor="middle" font-size="10" fill="var(--text-muted)" letter-spacing="1">ONE DOCKER-COMPOSE BOX &#183; AT RUNTIME</text>

  <rect x="340" y="28" width="200" height="48" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="57" text-anchor="middle" font-size="13" fill="var(--text-bright)">contestant browser</text>

  <line class="dgm-flow" x1="440" y1="78" x2="440" y2="106" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="452" y="97" font-size="10" fill="var(--text-muted)">HTTPS</text>

  <rect x="340" y="112" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="136" text-anchor="middle" font-size="13" fill="var(--text-bright)">caddy</text>
  <text x="440" y="154" text-anchor="middle" font-size="10" fill="var(--text-muted)">reverse proxy</text>

  <line class="dgm-flow" x1="440" y1="168" x2="440" y2="196" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="452" y="187" font-size="10" fill="var(--text-muted)">proxy</text>

  <rect x="340" y="202" width="200" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="440" y="226" text-anchor="middle" font-size="13" fill="var(--text-bright)">app</text>
  <text x="440" y="244" text-anchor="middle" font-size="10" fill="var(--text-muted)">apps/web &#183; Next.js UI</text>

  <path class="dgm-flow" d="M352 258 C 306 284 296 300 274 314" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="316" y="292" text-anchor="end" font-size="10" fill="var(--text-muted)">teams &#183; hints</text>

  <path class="dgm-flow" d="M528 258 C 574 284 584 300 606 314" fill="none" stroke="var(--text-muted)" marker-end="url(#ar)"/>
  <text x="566" y="292" font-size="10" fill="var(--text-muted)">leaderboard</text>

  <rect x="64" y="304" width="206" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="167" y="328" text-anchor="middle" font-size="13" fill="var(--text-bright)">srh</text>
  <text x="167" y="346" text-anchor="middle" font-size="10" fill="var(--text-muted)">Upstash REST proxy</text>

  <rect x="610" y="304" width="206" height="54" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="713" y="328" text-anchor="middle" font-size="13" fill="var(--text-bright)">scorer</text>
  <text x="713" y="346" text-anchor="middle" font-size="10" fill="var(--text-muted)">judge + leaderboard API</text>

  <path class="dgm-ants" d="M606 344 C 470 380 358 366 276 346" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>
  <text x="440" y="390" text-anchor="middle" font-size="10" fill="var(--accent)">scorer is the one writer for secure-development score state</text>

  <line class="dgm-flow" x1="167" y1="360" x2="167" y2="392" stroke="var(--text-muted)" marker-end="url(#ar)"/>

  <rect x="64" y="398" width="206" height="48" rx="8" fill="var(--surface)" stroke="var(--border)"/>
  <text x="167" y="427" text-anchor="middle" font-size="13" fill="var(--text-bright)">redis</text>

  <text x="596" y="412" font-size="10" fill="var(--text-muted)" letter-spacing="1">SCORING INGEST</text>
  <rect x="596" y="418" width="234" height="82" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="4 4"/>
  <rect class="dgm-gate" x="610" y="449" width="206" height="28" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="713" y="468" text-anchor="middle" font-size="10" fill="var(--text)">poll: sync &#8594; /score</text>

  <path class="dgm-ants" d="M713 416 L713 364" fill="none" stroke="var(--accent)" marker-end="url(#arR)"/>

  <text x="64" y="484" font-size="10" fill="var(--text-muted)">quiz, Jeopardy and AI score entirely app-side</text>
  <text x="64" y="498" font-size="10" fill="var(--text-muted)">and never touch scorer</text>
</svg>
