allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floor for a transitive (babel → next, eslint-config-next). pnpm
# would not re-resolve it within range on its own because it is also a peer
# of update-browserslist-db. GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g.
# Drop once every dependant's own range starts at or above 4.28.7.
overrides:
  browserslist: ">=4.28.7"
  # Security pin for minimatch@10's brace-expansion (eslint → minimatch):
  # exact, per the repo's pinned-dependencies rule, and scoped to major 5 so
  # the 1.x copy (fixed in range, at 1.1.21) is untouched. pnpm keeps 5.0.9
  # within ^5.0.8 on its own. GHSA-q2hr-2g5m-vwhr. Drop once minimatch's range
  # starts at or above 5.0.12.
  "brace-expansion@5": "5.0.12"
